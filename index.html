                            <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aditya’s Grand Wedding</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e57300;      /* Saffron */
      --marathi-green: #288f4f; /* Classic green */
      --accent: #ffeb99;       /* Yellow-gold */
      --cream: #fdf6e4;
      --border: #cbb883;
      --english-font: 'Montserrat', Arial, sans-serif;
      --marathi-font: 'Baloo 2', 'Montserrat', Arial, sans-serif;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--cream);
      color: #3e2723;
      font-family: var(--english-font);
      font-weight: 500;
    }
    .main-container {
      max-width: 650px;
      margin: 30px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px #f2c16440;
      padding: 2rem 1rem 1.5rem 1rem;
      border: 2px solid var(--border);
      position: relative;
    }
    .event-slide:not(.active) {
      display: none;
    }
    .event-slide {
      animation: fadeIn 0.7s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .slide-nav {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0 0.7rem 0;
      gap: 1rem;
    }
    .slide-nav button {
      padding: 7px 23px;
      background: var(--primary);
      border: none;
      border-radius: 1.2em;
      color: #fff;
      font-family: inherit;
      cursor: pointer;
      font-size: 1.14rem;
      font-weight: 500;
      transition: background 0.21s;
    }
    .slide-nav button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .lang-switch {
      position: absolute;
      right: 30px;
      top: 27px;
      z-index: 2;
    }
    .lang-switch button {
      font-family: inherit;
      background: var(--marathi-green);
      color: #fff;
      border: none;
      font-size: 1.04rem;
      border-radius: 12px;
      padding: 7px 21px;
      margin-left: 7px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lang-switch button.active, .lang-switch button:hover {
      background: var(--primary);
      color: #fff;
    }
    .event-heading {
      font-size: 2.1rem;
      font-family: var(--marathi-font);
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      text-align: center;
      margin-bottom: 7px;
      margin-top: 0;
    }
    .event-emoji {
      font-size: 2.2rem;
      display: block;
      text-align: center;
    }
    .event-date {
      font-size: 1.08rem;
      color: var(--marathi-green);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 0.7em;
      font-weight: 600;
    }
    ul, li {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .notes {
      background: var(--accent);
      padding: 1rem;
      border-radius: 0.8em;
      color: #3d2b04;
      max-width: 510px;
      margin: 20px auto 8px;
      box-shadow: 0 2px 7px #f9c97033;
      font-size: 1.04em;
    }
    .event-content {
      padding: 0.5em 0 0.5em 0;
      font-size: 1.12em;
    }
    .dress, .venue, .lunch {
      margin: 0.48em 0 0.48em 0;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent 6%, var(--marathi-green) 14%, transparent 94%);
      margin: 1.6em 0;
      border: none;
    }
    .footer {
      text-align: center;
      margin: 18px 0 0 0;
      font-size: 1.04em;
      color: #6a502e;
    }
    /* Decorative Motif on top */
    .motif {
      width: 88px; height: 88px;
      background: url("https://i.imgur.com/TabHQiE.png") center/contain no-repeat;
      margin: -56px auto 16px auto;
      filter: drop-shadow(0 2px 5px #ebba5140);
    }
    @media (max-width: 700px) {
      .main-container {
        padding: 0.7rem 0.1rem 1rem 0.1rem;
        max-width: 99vw;
      }
      .lang-switch {
        right: 8px; top: 7px;
      }
      .motif {width: 59px; height: 59px;}
      .event-heading {font-size: 1.28rem;}
    }
    /* Marathi font for body when in Marathi */
    body.marathi * {
      font-family: var(--marathi-font) !important;
    }
  </style>
</head>

      if (slide.footer) footerDiv.innerHTML = slide.footer;
      else footerDiv.innerHTML = "";

        currentSlide--;
        renderSlide();
      }

    document.getElementById('nextBtn').onclick = () => {
      if (currentSlide < data.length - 1) {
        currentSlide++;
        renderSlide();
      }
    };

      langEnBtn.classList.add('active');
      langMrBtn.classList.remove('active');
      document.body.classList.remove('marathi');
      renderSlide();
    };
    langMrBtn.onclick = () => {
      lang = 'mr';
      langMrBtn.classList.add('active');
      langEnBtn.classList.remove('active');
      document.body.classList.add('marathi');
