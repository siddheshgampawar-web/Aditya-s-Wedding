<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aditya’s Grand Wedding – Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts for headline + body -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f6f2ea;
      --gold: #e9cfa5;
      --primary-dark: #172042;
      --gold-accent: #FFEDC1;
      --deep-blue: #23264A;
      --blue-gradient: linear-gradient(100deg, #293579 70%, #5878d3 100%);
      --cream-gradient: linear-gradient(120deg, #fcf8f1 80%, #f7e2c2 100%);
      --body-font: 'Montserrat', Arial, sans-serif;
      --heading-font: 'Playfair Display', serif;
      --main-radius: 36px;
    }
    html, body {
      background: linear-gradient(120deg, #164269 10%, #f7e2c2 90%);
      background-attachment: fixed;
      color: #24253a;
      font-family: var(--body-font);
      margin: 0;
      font-size: 1.05rem;
      min-height: 100vh;
      letter-spacing: 0.03em;
      line-height: 1.7;
    }
    body.marathi * { font-family: var(--body-font), 'Baloo 2', Arial, serif !important; }
    .main-container {
      background: rgba(255,255,255,0.54);
      max-width: 800px;
      margin: 42px auto 30px auto;
      border-radius: var(--main-radius);
      box-shadow: 0 12px 60px 0 #1b2c4c24;
      padding: 0 0 2.5rem 0;
      position: relative;
      min-height: 80vh;
    }
    @media (max-width: 700px) {
      .main-container { margin: 12px 0 6vw 0; border-radius: 20px;}
    }
    .lang-switch {
      text-align: center;
      margin-top: 1.5rem;
      margin-bottom: 0.7rem;
      z-index: 3;
      position: relative;
    }
    .lang-switch button {
      font-family: var(--body-font);
      background: var(--deep-blue);
      color: #FFEDC1;
      border: none;
      font-size: 1.05rem;
      border-radius: 14px;
      padding: 8px 24px;
      margin-left: 7px;
      margin-right: 7px;
      cursor: pointer;
      transition: background 0.23s;
      outline: none;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 8px #23264A22;
    }
    .lang-switch button.active, .lang-switch button:focus, .lang-switch button:hover {
      background: #e9cfa5;
      color: var(--primary-dark);
    }
    .event-block {
      margin: 0 auto 3.2rem auto;
      padding: 0;
      border-radius: var(--main-radius);
      max-width: 650px;
      box-shadow: 0 6px 24px 0 #0000000c;
      background: var(--cream-gradient);
      transition: background 0.5s;
      position: relative;
    }
    .event-block.night {
      background: var(--blue-gradient);
      color: #ffe9bb;
      box-shadow: 0 7px 40px #17204233, 0 2px 12px #ffe29a22;
    }
    .event-block.centre {
      background: linear-gradient(120deg, #2c3580 50%, #fef6da 120%);
      color: #fffacc;
      box-shadow: 0 3px 70px 13px #a1ccff55;
    }
    .event-block.carnival, .event-block.sangit {
      background: linear-gradient(120deg, #45288c 44%, #f7e2c2 100%);
      color: #fdecc7;
      box-shadow: 0 8px 54px #2b358c36, 0 1.3px 8px #f6c14439;
    }
    .event-inside {
      padding: 2.5rem 2.3rem 2.2rem 2.3rem;
      border-radius: var(--main-radius);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 640px) {
      .event-inside{padding:1.05rem 6vw 1.1rem 6vw;}
    }
    .event-icons {
      font-size: 2.15em;
      margin-bottom: 4px;
      text-shadow: 0 3px 10px #e2dbbc59;
      line-height: 1.1em;
    }
    .event-title {
      font-family: var(--heading-font);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin: 0.03em 0 8px 0;
      color: #222a4a;
      text-shadow: 0 2px 7px #f3ecc430;
      line-height: 1.23;
    }
    .night .event-title, .carnival .event-title, .centre .event-title, .sangit .event-title {
      color: #fff7e1;
      text-shadow: 0 3px 10px #23264A85;
    }
    /* Event 1 always dark blue so it's visible */
    .event-block.event-welcome .event-title {
      color: #172042 !important;
      text-shadow: 0 2px 12px #cab87536;
    }
    .event-date {
      margin: 4px 0 1.2em 0;
      font-size: 1.15em;
      color: #28518b;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-shadow:0 1px 7px #ffe29a30;
    }
    .night .event-date, .carnival .event-date, .centre .event-date, .sangit .event-date {
      color: #FEF7CD;
      text-shadow: 0 2px 6px #0d122650;
    }
    .event-content {
      font-size: 1.2em;
      color: #1f211e;
      text-shadow: 0 1px 8px #fff6c217;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .night .event-content,
    .carnival .event-content,
    .centre .event-content,
    .sangit .event-content {
      color: #fff8dd;
      text-shadow: 0 1px 8px #1b1a3647;
    }
    ul, li { margin:0; padding:0; list-style:none; }
    .notes {
      background: #fdfadc;
      color: #684e24;
      max-width: 510px;
      margin: 25px auto 6px;
      box-shadow: 0 2px 7px #f9c9702c;
      padding: 1em;
      border-radius: 0.8em;
      font-size: 1.11em;
      font-weight: 500;
      box-shadow: 0 7px 22px #e7bb6548;
    }
    .divider {
      height: 0.6px;
      margin: 3.3rem auto 2.15rem auto;
      max-width: 360px;
      border: none;
      background: linear-gradient(87deg, transparent 0%,#efe3bc 37%, #3829ad 60%, transparent 100%);
      opacity: 0.94;
    }
    .event-block.carnival:before, .event-block.sangit:before {
      content: "✨"; font-size: 44px; position: absolute; left: 17px; top: -28px; opacity: 0.19;
    }
    .event-block.carnival:after, .event-block.sangit:after {
      content: "🎇"; font-size: 44px; position: absolute; right:18px; bottom:-32px; opacity: 0.17;
    }
    @media (max-width: 430px) {
      .main-container { padding:0;}
      .event-block, .event-block.night, .event-block.carnival, .event-block.sangit {max-width:98vw;}
      .event-inside {padding:1rem 1vw 1.2rem 1vw;}
      .event-title {font-size: 1.29rem;}
      .lang-switch {margin-top: 1.1rem;}
    }
  </style>
</head>

function renderEvents(lang) {
  const listDiv = document.getElementById('events-list');
  listDiv.innerHTML = '';
  events.forEach((ev, i)=>{
    let blockClass="event-block";
    if(ev.special) blockClass += " " + ev.special;
    if(ev.type.includes('night')) blockClass+=" night";
    if(ev.type.includes('carnival')) blockClass+=" carnival";
    if(ev.type.includes('centre')) blockClass+=" centre";
    if(ev.type.includes('sangit')) blockClass+=" sangit";
    const d=ev[lang];
    listDiv.innerHTML+=`
    <section class="${blockClass}">
      <div class="event-inside">
        <div class="event-icons">${d.icons}</div>
        <div class="event-title">${d.title}</div>
        <div class="event-date">${d.date||""}</div>
        <div class="event-content">${d.content}</div>
      </div>
    </section>
    <hr class="divider">`;
  });
}

let lang = "en";
document.getElementById("lang-en").onclick = function() {
  lang = "en";
  document.body.classList.remove('marathi');
  this.classList.add('active');
  document.getElementById("lang-mr").classList.remove('active');
  renderEvents(lang);
};
document.getElementById("lang-mr").onclick = function() {
  lang = "mr";
  document.body.classList.add('marathi');
  this.classList.add('active');
  document.getElementById("lang-en").classList.remove('active');
  renderEvents(lang);
};
renderEvents(lang);
</script>
</body>
</html>
